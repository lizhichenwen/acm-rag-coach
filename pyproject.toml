[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acm-coach"
version = "4.0.0"
description = "面向 ACM 程序设计竞赛的 RAG 智能陪练系统"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110", "uvicorn>=0.27", "sqlalchemy>=2.0", "pyjwt>=2.8",
    "openai>=1.30", "chromadb>=0.5", "sentence-transformers>=2.6",
    "httpx>=0.27", "pydantic>=2.9", "pydantic-settings>=2.4", "jieba>=0.42",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]
ui = ["streamlit>=1.32", "pandas>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: 行长度由 formatter 管，不在此报错
# UP009: 项目统一保留 "# -*- coding: utf-8 -*-" 头（Py2/3 兼容惯例，无害）
# I001:  import 顺序不强制，避免教学代码里为分组反复调整
# UP037: 字符串形式的类型注解在 from __future__ import annotations 下可读性更好，保留
# B905:  zip 不强制 strict（Python 3.10 目标， strict 仅 3.10+，且多处为等长遍历）
ignore = ["E501", "UP009", "I001", "UP037", "B905"]
