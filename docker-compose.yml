services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      DATABASE_URL: sqlite:////app/data/acm_coach.db
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data          # 索引与数据库持久化
      - ./logs:/app/logs
      # 重排/嵌入模型缓存：Dockerfile 设了 HF_HUB_OFFLINE=1，容器不会联网下载。
      # 宿主预下载一次后挂进来，G4 才能真正走 cross-encoder（否则降级融合打分）。
      - ${HF_CACHE_DIR:-$HOME/.cache/huggingface}:/root/.cache/huggingface:ro
    restart: unless-stopped

  ui:
    build: .
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]
    environment:
      API_BASE: http://api:8000
    depends_on: [api]
    restart: unless-stopped
    volumes:
      - ./data:/app/data
