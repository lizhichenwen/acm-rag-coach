name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装轻量依赖（测试不依赖向量模型）
        run: |
          python -m pip install --upgrade pip
          pip install fastapi sqlalchemy pyjwt httpx pydantic pydantic-settings pytest ruff
      - name: 静态检查
        run: ruff check src tests
      - name: 单元测试
        run: python -m pytest tests/ -q

  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          pip install fastapi sqlalchemy pyjwt httpx pydantic pydantic-settings
          python -c "
          import sys; sys.path.insert(0, 'src')
          from acm_coach.api.app import app
          spec = app.openapi()
          assert len(spec['paths']) > 20, spec['paths'].keys()
          print('OpenAPI paths:', len(spec['paths']))
          "
